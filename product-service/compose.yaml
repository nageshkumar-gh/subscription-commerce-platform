name: subscription-product

services:
  product-mongodb:
    image: mongo:7.0-jammy
    container_name: product-mongodb
    # Localhost-only, for MongoDB Compass / mongosh; not reachable from other machines.
    ports: ["127.0.0.1:${PRODUCT_MONGODB_PORT:-27018}:27017"]
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes:
      - product-mongodb-data:/data/db
    mem_limit: 512m
    labels:
      com.datadoghq.tags.env: "${DD_ENV:-test}"
      com.datadoghq.tags.service: "product-mongodb"
      com.datadoghq.tags.version: "${MONGODB_VERSION:-7.0}"
      com.datadoghq.ad.logs: >-
        [{"source":"mongodb","service":"product-mongodb"}]
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/27017'"]
      interval: 10s
      timeout: 20s
      retries: 5
      start_period: 30s
    networks: [subscription-platform]

  product-service:
    build: .
    container_name: product-service
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${PRODUCT_SERVICE_PORT:-8081}:8081"
    environment:
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx192m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
      SPRING_MONGODB_URI: mongodb://product-mongodb:27017/product_db
      AUTH_JWT_SECRET: "${AUTH_JWT_SECRET:?AUTH_JWT_SECRET must be set}"
      CORS_ALLOWED_ORIGINS: "${CORS_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}"
    labels:
      com.datadoghq.tags.env: "${DD_ENV:-test}"
      com.datadoghq.tags.service: "product-service"
      com.datadoghq.tags.version: "${APP_VERSION:-manual}"
      com.datadoghq.ad.logs: >-
        [{"source":"java","service":"product-service"}]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8081/actuator/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    depends_on:
      product-mongodb:
        condition: service_healthy
    networks: [subscription-platform]
    mem_limit: 320m

volumes:
  product-mongodb-data:
    name: subscription-product-mongodb-data

networks:
  subscription-platform:
    external: true
    name: subscription-platform
