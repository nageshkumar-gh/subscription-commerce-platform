spring.application.name=customer-service
server.port=8080

spring.mongodb.uri=mongodb://localhost:27017/customer_db
spring.data.mongodb.auto-index-creation=true
auth.jwt-secret=${AUTH_JWT_SECRET}
auth.jwt-ttl-seconds=3600
auth.catalog-admin-customer-ids=${CATALOG_ADMIN_CUSTOMER_IDS:}
# Customer IDs allowed to sign in to the admin (operations) console.
auth.agent-customer-ids=${AGENT_CUSTOMER_IDS:}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
springdoc.swagger-ui.path=/swagger-ui.html
