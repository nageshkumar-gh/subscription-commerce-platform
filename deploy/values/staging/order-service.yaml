name: order-service
port: 8082

image:
  repository: 971422709527.dkr.ecr.us-east-1.amazonaws.com/order-service

env:
  # Same database host and name as order-service/compose.yaml; resolves to this namespace's own MongoDB.
  SPRING_MONGODB_URI: mongodb://order-mongodb:27017/order_db
  CORS_ALLOWED_ORIGINS: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174

mongodb:
  enabled: true
  name: order-mongodb
