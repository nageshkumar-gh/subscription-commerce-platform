server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS resolves each independently deployed service at
  # request time. The UI can therefore start while later-stage services are off.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/auth {
    set $customer_upstream customer-service:8080;
    proxy_pass http://$customer_upstream;
  }

  location /api/customers {
    set $customer_upstream customer-service:8080;
    proxy_pass http://$customer_upstream;
  }
  location /api/products {
    set $product_upstream product-service:8081;
    proxy_pass http://$product_upstream;
  }
  location /api/esim-plans {
    set $product_upstream product-service:8081;
    proxy_pass http://$product_upstream;
  }
  location /api/orders {
    set $order_upstream order-service:8082;
    proxy_pass http://$order_upstream;
  }
  location /api/workflows {
    set $orchestration_upstream orchestration-service:8087;
    proxy_pass http://$orchestration_upstream;
  }
  # Order progress for the storefront: read-only, one order at a time. Exact-match locations keep the
  # operator approve/reject endpoints (POST /api/<step>/{id}/...) and the full listings off the public UI.
  location = /api/payments {
    limit_except GET { deny all; }
    if ($arg_orderId = "") { return 404; }
    set $payment_upstream payment-service:8083;
    proxy_pass http://$payment_upstream;
  }
  location = /api/fulfillments {
    limit_except GET { deny all; }
    if ($arg_orderId = "") { return 404; }
    set $fulfillment_upstream fulfillment-service:8085;
    proxy_pass http://$fulfillment_upstream;
  }
  location = /api/activations {
    limit_except GET { deny all; }
    if ($arg_orderId = "") { return 404; }
    set $network_upstream network-service:8084;
    proxy_pass http://$network_upstream;
  }
  # Subscriptions may also be looked up by customer for the "My subscription" page.
  location = /api/subscriptions {
    limit_except GET { deny all; }
    set $scoped "$arg_orderId$arg_customerId";
    if ($scoped = "") { return 404; }
    set $billing_upstream billing-service:8086;
    proxy_pass http://$billing_upstream;
  }
  location ~ ^/api/tracking/orders/[A-Za-z0-9-]+/events$ {
    limit_except GET { deny all; }
    set $tracking_upstream tracking-service:8088;
    proxy_pass http://$tracking_upstream;
  }
  location / { try_files $uri $uri/ /index.html; }
}
