server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS resolves each independently deployed service at
  # request time. The UI can therefore start while later-stage services are off.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/auth {
    set $customer_upstream customer-service:8080;
    proxy_pass http://$customer_upstream;
  }

  location /api/customers {
    set $customer_upstream customer-service:8080;
    proxy_pass http://$customer_upstream;
  }
  location /api/products {
    set $product_upstream product-service:8081;
    proxy_pass http://$product_upstream;
  }
  location /api/esim-plans {
    set $product_upstream product-service:8081;
    proxy_pass http://$product_upstream;
  }
  location /api/orders {
    set $order_upstream order-service:8082;
    proxy_pass http://$order_upstream;
  }
  location /api/workflows {
    set $orchestration_upstream orchestration-service:8087;
    proxy_pass http://$orchestration_upstream;
  }
  location / { try_files $uri $uri/ /index.html; }
}
