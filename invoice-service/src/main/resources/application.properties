spring.application.name=invoice-service
server.port=8089
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/invoice}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:invoice}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:invoice}
spring.flyway.enabled=true
# Spring Batch job metadata lives in the same Postgres database; jobs only start from the schedule or the API.
spring.batch.jdbc.initialize-schema=always
spring.batch.job.enabled=false
services.billing-url=${SERVICES_BILLING_URL:http://localhost:8086}
services.payment-url=${SERVICES_PAYMENT_URL:http://localhost:8083}
# Invoicing calendar: which day it is, and when the scheduled run fires, is decided in this zone.
invoice.zone=${INVOICE_ZONE:Europe/Dublin}
# Irish standard VAT; plan prices are VAT-inclusive.
invoice.vat-rate=${INVOICE_VAT_RATE:0.23}
invoice.currency=EUR
invoice.chunk-size=50
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5174,http://127.0.0.1:5174}
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
