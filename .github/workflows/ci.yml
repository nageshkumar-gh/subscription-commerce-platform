name: CI

on:
  pull_request:
  push:
    branches: [main]

# A newer push to the same branch or PR supersedes the running checks.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  java:
    name: Java (${{ matrix.service }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service:
          - customer-service
          - product-service
          - order-service
          - payment-service
          - network-service
          - fulfillment-service
          - billing-service
          - orchestration-service
          - tracking-service
          - invoice-service
    defaults:
      run:
        working-directory: ${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml
      - name: Test
        run: mvn -B -ntp test

  ui:
    name: UI (${{ matrix.app }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        app: [web-ui, admin-ui]
    defaults:
      run:
        working-directory: ${{ matrix.app }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: ${{ matrix.app }}/package-lock.json
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Type-check and build
        run: npm run build
      - name: Test
        run: npm test

  # Single check for branch protection to require, so adding a service does not mean editing the rules.
  ci-passed:
    name: CI passed
    if: always()
    needs: [java, ui]
    runs-on: ubuntu-latest
    steps:
      - name: Require every job to succeed
        run: |
          [ "${{ needs.java.result }}" = success ] && [ "${{ needs.ui.result }}" = success ] || { echo "java=${{ needs.java.result }} ui=${{ needs.ui.result }}"; exit 1; }

  # Push images to ECR only after a merge to main has passed every check, tagged with the commit SHA.
  publish:
    name: Publish (${{ matrix.image }})
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [ci-passed]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write # OIDC sign-in to AWS, so no long-lived keys are stored in GitHub.
    strategy:
      fail-fast: false
      matrix:
        image:
          - customer-service
          - product-service
          - order-service
          - payment-service
          - network-service
          - fulfillment-service
          - billing-service
          - orchestration-service
          - tracking-service
          - invoice-service
          - web-ui
          - admin-ui
    steps:
      - uses: actions/checkout@v4
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
      - id: ecr
        uses: aws-actions/amazon-ecr-login@v2
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.image }}
          push: true
          tags: ${{ steps.ecr.outputs.registry }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
