spring.application.name=fulfillment-service
server.port=8085
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27022/fulfillment_db}
spring.data.mongodb.auto-index-creation=true
fulfillment.transition-delay-seconds=15
# When false (default) operators advance or reject deliveries from the admin UI.
fulfillment.auto-advance=${FULFILLMENT_AUTO_ADVANCE:false}
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
