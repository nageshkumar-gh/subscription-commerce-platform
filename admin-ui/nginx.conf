server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Resolve upstreams per request (variables + resolver), so the console starts and keeps working while any one
  # backend is down; that route just returns 502 until it is back.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Every API and health call must carry an operations agent's token: customer-service verifies it and the
  # orders:operate scope. The console page itself and sign-in stay open so an agent can log in.
  auth_request /_verify_agent;

  location = /_verify_agent {
    internal;
    set $customer_upstream customer-service:8080;
    proxy_pass http://$customer_upstream/api/auth/verify?scope=orders:operate;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Authorization $http_authorization;
  }

  # Sign-in: exchanges email/password for a token, then confirms the account is an agent.
  location = /api/auth/login {
    auth_request off;
    set $customer_upstream customer-service:8080;
    proxy_pass http://$customer_upstream;
  }
  location = /api/auth/agent {
    auth_request off;
    set $customer_upstream customer-service:8080;
    proxy_pass http://$customer_upstream/api/auth/verify?scope=orders:operate;
  }

  location /api/orders { set $order_service_upstream order-service:8082; proxy_pass http://$order_service_upstream; }
  location /api/payments { set $payment_service_upstream payment-service:8083; proxy_pass http://$payment_service_upstream; }
  location /api/activations { set $network_service_upstream network-service:8084; proxy_pass http://$network_service_upstream; }
  location /api/fulfillments { set $fulfillment_service_upstream fulfillment-service:8085; proxy_pass http://$fulfillment_service_upstream; }
  location /api/subscriptions { set $billing_service_upstream billing-service:8086; proxy_pass http://$billing_service_upstream; }
  location /api/tracking { set $tracking_service_upstream tracking-service:8088; proxy_pass http://$tracking_service_upstream; }
  location /api/workflows { set $orchestration_service_upstream orchestration-service:8087; proxy_pass http://$orchestration_service_upstream; }
  location /api/billing-runs { set $invoice_upstream invoice-service:8089; proxy_pass http://$invoice_upstream; }
  location /api/billing-schedule { set $invoice_upstream invoice-service:8089; proxy_pass http://$invoice_upstream; }
  location /api/invoices { set $invoice_upstream invoice-service:8089; proxy_pass http://$invoice_upstream; }
  location = /ops/health/invoice { set $invoice_upstream invoice-service:8089; proxy_pass http://$invoice_upstream/actuator/health; }
  location = /ops/health/order { set $order_service_upstream order-service:8082; proxy_pass http://$order_service_upstream/actuator/health; }
  location = /ops/health/orchestration { set $orchestration_service_upstream orchestration-service:8087; proxy_pass http://$orchestration_service_upstream/actuator/health; }
  location = /ops/health/tracking { set $tracking_service_upstream tracking-service:8088; proxy_pass http://$tracking_service_upstream/actuator/health; }
  location = /ops/health/payment { set $payment_service_upstream payment-service:8083; proxy_pass http://$payment_service_upstream/actuator/health; }
  location = /ops/health/network { set $network_service_upstream network-service:8084; proxy_pass http://$network_service_upstream/actuator/health; }
  location = /ops/health/fulfillment { set $fulfillment_service_upstream fulfillment-service:8085; proxy_pass http://$fulfillment_service_upstream/actuator/health; }
  location = /ops/health/billing { set $billing_service_upstream billing-service:8086; proxy_pass http://$billing_service_upstream/actuator/health; }
  location / {
    auth_request off;
    try_files $uri $uri/ /index.html;
  }
}
