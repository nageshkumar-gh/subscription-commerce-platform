server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;
  # Resolve at request time for the newer invoice-service, so this UI starts even while it is down.
  resolver 127.0.0.11 valid=10s ipv6=off;

  location /api/orders { proxy_pass http://order-service:8082; }
  location /api/payments { proxy_pass http://payment-service:8083; }
  location /api/activations { proxy_pass http://network-service:8084; }
  location /api/fulfillments { proxy_pass http://fulfillment-service:8085; }
  location /api/subscriptions { proxy_pass http://billing-service:8086; }
  location /api/tracking { proxy_pass http://tracking-service:8088; }
  location /api/workflows { proxy_pass http://orchestration-service:8087; }
  location /api/billing-runs { set $invoice_upstream invoice-service:8089; proxy_pass http://$invoice_upstream; }
  location /api/billing-schedule { set $invoice_upstream invoice-service:8089; proxy_pass http://$invoice_upstream; }
  location /api/invoices { set $invoice_upstream invoice-service:8089; proxy_pass http://$invoice_upstream; }
  location = /ops/health/invoice { set $invoice_upstream invoice-service:8089; proxy_pass http://$invoice_upstream/actuator/health; }
  location = /ops/health/order { proxy_pass http://order-service:8082/actuator/health; }
  location = /ops/health/orchestration { proxy_pass http://orchestration-service:8087/actuator/health; }
  location = /ops/health/tracking { proxy_pass http://tracking-service:8088/actuator/health; }
  location = /ops/health/payment { proxy_pass http://payment-service:8083/actuator/health; }
  location = /ops/health/network { proxy_pass http://network-service:8084/actuator/health; }
  location = /ops/health/fulfillment { proxy_pass http://fulfillment-service:8085/actuator/health; }
  location = /ops/health/billing { proxy_pass http://billing-service:8086/actuator/health; }
  location / { try_files $uri $uri/ /index.html; }
}
