spring.application.name=orchestration-service
server.port=8087
temporal.target=${TEMPORAL_TARGET:localhost:7233}
spring.kafka.bootstrap-servers=${SPRING_KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JacksonJsonSerializer
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.acks=all
services.payment-url=${SERVICES_PAYMENT_URL:http://localhost:8083}
services.network-url=${SERVICES_NETWORK_URL:http://localhost:8084}
services.fulfillment-url=${SERVICES_FULFILLMENT_URL:http://localhost:8085}
services.billing-url=${SERVICES_BILLING_URL:http://localhost:8086}
services.order-url=${SERVICES_ORDER_URL:http://localhost:8082}
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174}
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
springdoc.swagger-ui.path=/swagger-ui.html
