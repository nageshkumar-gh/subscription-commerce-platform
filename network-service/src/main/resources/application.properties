spring.application.name=network-service
server.port=8084
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27021/network_db}
spring.data.mongodb.auto-index-creation=true
network.activation-delay-seconds=30
# When false (default) operators advance or reject activations from the admin UI.
network.auto-advance=${NETWORK_AUTO_ADVANCE:false}
springdoc.swagger-ui.path=/swagger-ui.html
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
server.shutdown=graceful
