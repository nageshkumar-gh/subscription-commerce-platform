name: subscription-billing
services:
  billing-mongodb:
    image: mongo:7.0-jammy
    container_name: billing-mongodb
    # Localhost-only, for MongoDB Compass / mongosh; not reachable from other machines.
    ports: ["127.0.0.1:${BILLING_MONGODB_PORT:-27023}:27017"]
    restart: unless-stopped
    command: ["mongod", "--wiredTigerCacheSizeGB", "0.25"]
    volumes: ["billing-mongodb-data:/data/db"]
    mem_limit: 512m
    labels:
      com.datadoghq.tags.env: "${DD_ENV:-test}"
      com.datadoghq.tags.service: billing-mongodb
      com.datadoghq.tags.version: "${MONGODB_VERSION:-7.0}"
      com.datadoghq.ad.logs: '[{"source":"mongodb","service":"billing-mongodb"}]'
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/127.0.0.1/27017'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [subscription-platform]
  billing-service:
    build: .
    container_name: billing-service
    restart: unless-stopped
    init: true
    ports: ["127.0.0.1:${BILLING_SERVICE_PORT:-8086}:8086"]
    environment:
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx192m -XX:+UseSerialGC -XX:TieredStopAtLevel=1
      SPRING_MONGODB_URI: mongodb://billing-mongodb:27017/billing_db
      SERVICES_PAYMENT_URL: http://payment-service:8083
      SERVICES_NETWORK_URL: http://network-service:8084
      SERVICES_FULFILLMENT_URL: http://fulfillment-service:8085
    mem_limit: 320m
    depends_on:
      billing-mongodb: {condition: service_healthy}
    labels:
      com.datadoghq.tags.env: "${DD_ENV:-test}"
      com.datadoghq.tags.service: billing-service
      com.datadoghq.tags.version: "${APP_VERSION:-manual}"
      com.datadoghq.ad.logs: '[{"source":"java","service":"billing-service"}]'
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/127.0.0.1/8086 && printf \"GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n\" >&3 && grep -q UP <&3'"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks: [subscription-platform]
volumes:
  billing-mongodb-data: {name: subscription-billing-mongodb-data}
networks:
  subscription-platform: {external: true, name: subscription-platform}
